services:
  database:
    image: postgres:19.0-trixie
    container_name: payment-database
    environment:
      POSTGRES_USER: payment
      POSTGRES_PASSWORD: payment
      POSTGRES_DB: payment
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.10.3-trixie
    container_name: payment-redis
    ports:
      - "6379:6379"

  nats:
    image: nats:2.15.3-alpine3.22
    container_name: payment-nats
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"

volumes:
  pgdata:
